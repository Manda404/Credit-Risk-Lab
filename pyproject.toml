[tool.poetry]
name = "credit_risk_lab"
version = "0.2.0"
description = "Framework modulaire pour l'entraînement, l'évaluation et le déploiement de modèles de scoring crédit et d'approbation de prêts"
authors = ["Manda Surel <s239150.eps@gmail.com>"]
readme = "README.md"
packages = [{ include = "credit_risk_lab", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
pandas = "^2.2.0"
loguru = "^0.7.2"
scikit-learn = "^1.5.0"
xgboost = "^2.0.3"
catboost = "^1.2.5"
lightgbm = "^4.6.0"
pyyaml = "^6.0"
mlflow = "^3.6.0"
python-dotenv = "^1.2.1"
plotly = "^6.4.0"
nbformat = "^5.10.4"
joblib = "^1.4.0"

# Optionnel mais recommandé pour un projet Credit Risk
# car utile pour le PSI, KS, p-values, tests stat...
scipy = "^1.12.0"

fastapi = "^0.115.0"
uvicorn = {version = "^0.30.0", extras = ["standard"]}
pydantic-settings = "^2.12.0"
autocarver = "^7.5.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0"
isort = "^5.13.0"
mypy = "^1.10.0"
seaborn = "^0.13.0"
jupyter = "^1.0.0"
nbconvert = "^7.16.0"
httpx = "^0.28.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
