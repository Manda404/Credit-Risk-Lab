# Single source of truth for candidate model hyperparameters.
# Set `enabled: false` to exclude a candidate without changing Python code.
models:
  logistic_regression:
    enabled: true
    display_name: LogisticRegression
    parameters:
      max_iter: 2000
  random_forest:
    enabled: true
    display_name: RandomForest
    parameters:
      n_jobs: -1
  xgboost:
    enabled: true
    display_name: XGBoost
    parameters:
      eval_metric: logloss
      n_jobs: -1
  catboost:
    enabled: true
    display_name: CatBoost
    parameters:
      loss_function: Logloss
      eval_metric: Logloss
      verbose: false
      allow_writing_files: false
  lightgbm:
    enabled: false
    display_name: LightGBM
    early_stopping_rounds: 15
    parameters:
      n_estimators: 120
      learning_rate: 0.06
      num_leaves: 31
      subsample: 0.85
      colsample_bytree: 0.85
      n_jobs: -1
      verbosity: -1
